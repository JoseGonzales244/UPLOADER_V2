<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Architecture Visualizer</title>
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: #111622;
      --bg-surface-elevated: #182030;
      --bg-surface-hover: #222c42;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-purple: #a855f7;
      --glow-active: rgba(99, 102, 241, 0.4);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      --header-height: 56px;
      --sidebar-width: 360px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    header {
      height: var(--header-height);
      background: rgba(17, 22, 34, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg-surface-hover);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      width: 200px;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
      width: 260px;
    }

    .btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .btn.active {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    /* Main Container */
    .app-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Canvas / Viewport */
    .viewport-container {
      flex: 1;
      position: relative;
      background-image: 
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
      background-size: 32px 32px;
      overflow: hidden;
      cursor: grab;
    }
    .viewport-container.panning {
      cursor: grabbing;
    }

    #architecture-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
    }

    /* Floating Toolbar */
    .floating-toolbar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(17, 22, 34, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      gap: 6px;
      z-index: 30;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s ease;
    }
    .tool-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    /* Layers Legend Bar */
    .layer-filter-bar {
      position: absolute;
      top: 16px;
      left: 20px;
      display: flex;
      gap: 8px;
      z-index: 30;
      flex-wrap: wrap;
      max-width: calc(100% - var(--sidebar-width) - 60px);
    }
    .layer-pill {
      background: rgba(17, 22, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .layer-pill.inactive {
      opacity: 0.4;
      filter: grayscale(1);
    }
    .layer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Right Sidebar (Flows Panel) */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.collapsed {
      transform: translateX(100%);
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-count {
      font-size: 11px;
      background: var(--bg-surface-elevated);
      color: var(--accent-cyan);
      padding: 2px 7px;
      border-radius: 10px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .flows-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .flow-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .flow-card:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    .flow-card.active {
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.08);
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
    }
    .flow-card.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 3px;
      background: var(--accent-primary);
      border-radius: 0 4px 4px 0;
    }

    .flow-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .flow-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .flow-steps-count {
      font-size: 11px;
      color: var(--text-muted);
    }
    .flow-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    /* Active Flow Step Walkthrough */
    .flow-walkthrough {
      background: var(--bg-base);
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid var(--border-subtle);
      display: none;
    }
    .flow-card.active .flow-walkthrough {
      display: block;
    }
    .step-item {
      display: flex;
      gap: 8px;
      font-size: 11px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      align-items: flex-start;
    }
    .step-item:last-child {
      border-bottom: none;
    }
    .step-item.current-step {
      color: var(--accent-cyan);
      font-weight: 600;
    }
    .step-num {
      background: var(--bg-surface-elevated);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }
    .step-item.current-step .step-num {
      background: var(--accent-cyan);
      color: #000;
    }

    .flow-controls {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .flow-ctrl-btn {
      flex: 1;
      padding: 4px;
      border-radius: 6px;
      background: var(--bg-surface-hover);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .flow-ctrl-btn:hover {
      background: var(--accent-primary);
      color: #fff;
    }

    /* SVG Elements */
    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Layers Background Swimlanes */
    .swimlane {
      fill: rgba(255, 255, 255, 0.015);
      stroke: var(--border-subtle);
      stroke-dasharray: 4 4;
      rx: 12;
    }
    .swimlane-label {
      font-size: 12px;
      font-weight: 600;
      fill: var(--text-muted);
      text-anchor: start;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Edges */
    .edge-path {
      fill: none;
      stroke: var(--border-strong);
      stroke-width: 1.5;
      transition: stroke 0.3s, stroke-width 0.3s, opacity 0.3s;
    }
    .edge-path.active {
      stroke: var(--accent-cyan);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.6));
      stroke-dasharray: 6 3;
      animation: dash-flow 1.5s linear infinite;
    }
    .edge-path.dimmed {
      opacity: 0.1;
    }

    @keyframes dash-flow {
      to {
        stroke-dashoffset: -18;
      }
    }

    .edge-label-bg {
      fill: var(--bg-surface);
      rx: 4;
    }
    .edge-label-text {
      font-size: 9px;
      fill: var(--text-muted);
      text-anchor: middle;
      dominant-baseline: central;
      font-family: monospace;
    }

    /* Nodes */
    .node-group {
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.3s;
    }
    .node-group.dimmed {
      opacity: 0.15;
    }
    .node-group.active .node-rect {
      stroke: var(--accent-primary);
      stroke-width: 2;
      filter: drop-shadow(0 0 12px var(--glow-active));
    }
    .node-group.pulse-step .node-rect {
      stroke: var(--accent-cyan);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 18px rgba(6, 182, 212, 0.8));
      animation: node-pulse 1s infinite alternate;
    }

    @keyframes node-pulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }

    .node-rect {
      fill: var(--bg-surface);
      stroke: var(--border-subtle);
      stroke-width: 1.2;
      rx: 10;
      transition: all 0.2s ease;
    }
    .node-group:hover .node-rect {
      stroke: var(--accent-cyan);
      fill: var(--bg-surface-hover);
    }

    .node-layer-pill {
      rx: 4;
    }
    .node-layer-text {
      font-size: 9px;
      font-weight: 600;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: central;
      text-transform: uppercase;
    }

    .node-title {
      font-size: 13px;
      font-weight: 600;
      fill: var(--text-primary);
      dominant-baseline: central;
    }
    .node-subtitle {
      font-size: 10px;
      fill: var(--text-secondary);
      dominant-baseline: central;
      font-family: monospace;
    }
    .node-icon-bg {
      rx: 6;
    }

    /* Tooltip */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(17, 22, 34, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
      max-width: 320px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }
    #tooltip h4 {
      font-size: 13px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    #tooltip .tooltip-file {
      font-family: monospace;
      font-size: 10px;
      color: var(--accent-cyan);
      word-break: break-all;
      margin-bottom: 6px;
    }
    #tooltip .tooltip-desc {
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    #tooltip .tooltip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    #tooltip .tooltip-tag {
      font-size: 10px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    /* Modal for Raw JSON */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      width: 700px;
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body {
      flex: 1;
      padding: 16px;
      overflow: auto;
    }
    .modal-body pre {
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      color: var(--accent-cyan);
      background: var(--bg-base);
      padding: 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">AV</div>
      <div>
        <div class="brand-title" id="repo-title">Codebase Architecture</div>
      </div>
      <span class="brand-badge" id="pattern-badge">Clean Architecture</span>
    </div>

    <div class="nav-controls">
      <input type="text" id="node-search" class="search-input" placeholder="Search node or file..." />
      <button class="btn" id="btn-reset-view" title="Reset pan & zoom">⟲ Reset</button>
      <button class="btn" id="btn-toggle-flows" title="Toggle flows sidebar">☰ Flows</button>
      <button class="btn" id="btn-view-json" title="View schema JSON">{ } JSON</button>
    </div>
  </header>

  <!-- Main Body -->
  <div class="app-body">
    <!-- Viewport / Canvas -->
    <div class="viewport-container" id="viewport">
      <!-- Layers Filter Header -->
      <div class="layer-filter-bar" id="layer-filters"></div>

      <!-- SVG Graph Canvas -->
      <div id="architecture-canvas">
        <svg id="svg-root">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="rgba(255, 255, 255, 0.4)" />
            </marker>
            <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4" />
            </marker>
          </defs>
          <g id="swimlanes-layer"></g>
          <g id="edges-layer"></g>
          <g id="nodes-layer"></g>
        </svg>
      </div>

      <!-- Floating Controls -->
      <div class="floating-toolbar">
        <button class="tool-btn" id="tool-zoom-in" title="Zoom In">+</button>
        <button class="tool-btn" id="tool-zoom-out" title="Zoom Out">−</button>
        <button class="tool-btn" id="tool-fit" title="Fit to Screen">⛶</button>
      </div>
    </div>

    <!-- Right Sidebar (Flows Panel) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span>Execution Flows</span>
          <span class="badge-count" id="flows-count">0</span>
        </div>
      </div>
      <div class="flows-list" id="flows-list"></div>
    </aside>
  </div>

  <!-- Hover Tooltip -->
  <div id="tooltip"></div>

  <!-- JSON Modal -->
  <div class="modal-overlay" id="json-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="font-size: 14px;">Architecture Data (JSON)</h3>
        <button class="btn" id="modal-close">✕ Close</button>
      </div>
      <div class="modal-body">
        <pre id="json-content"></pre>
      </div>
    </div>
  </div>

  <!-- Interactive Logic -->
  <script>
    (function () {
      // 1. Data Loader
      let archData = null;
      try {
        const rawEl = document.getElementById("architecture-data");
        if (rawEl && rawEl.textContent.trim()) {
          archData = JSON.parse(rawEl.textContent);
        }
      } catch (err) {
        console.error("Failed to parse architecture data", err);
      }

      if (!archData) return;

      // 2. State
      const state = {
        transform: { x: 80, y: 80, scale: 0.95 },
        isPanning: false,
        panStart: { x: 0, y: 0 },
        activeFlowId: null,
        activeStepIdx: 0,
        autoPlayTimer: null,
        activeLayers: new Set(archData.layers.map(l => l.id)),
        searchQuery: "",
        nodePositions: new Map(), // id -> {x, y, width, height}
        draggedNode: null,
        dragOffset: { x: 0, y: 0 }
      };

      // 3. UI Elements
      const viewport = document.getElementById("viewport");
      const canvas = document.getElementById("architecture-canvas");
      const svgRoot = document.getElementById("svg-root");
      const swimlanesLayer = document.getElementById("swimlanes-layer");
      const edgesLayer = document.getElementById("edges-layer");
      const nodesLayer = document.getElementById("nodes-layer");
      const flowsList = document.getElementById("flows-list");
      const layerFilters = document.getElementById("layer-filters");
      const tooltip = document.getElementById("tooltip");
      const repoTitle = document.getElementById("repo-title");
      const patternBadge = document.getElementById("pattern-badge");
      const flowsCount = document.getElementById("flows-count");
      const searchInput = document.getElementById("node-search");
      const sidebar = document.getElementById("sidebar");

      // Setup Header Metadata
      if (archData.metadata) {
        repoTitle.textContent = archData.metadata.repository || "Architecture Graph";
        if (archData.metadata.architecturePattern) {
          patternBadge.textContent = archData.metadata.architecturePattern;
        }
      }
      flowsCount.textContent = archData.flows ? archData.flows.length : 0;

      // 4. Layout Calculation (Hierarchical Swimlanes)
      const NODE_WIDTH = 220;
      const NODE_HEIGHT = 74;
      const LAYER_GAP = 90;
      const NODE_GAP_X = 50;

      function calculateLayout() {
        const sortedLayers = [...archData.layers].sort((a, b) => a.order - b.order);
        let currentY = 40;
        let maxRowWidth = 1000;

        sortedLayers.forEach(layer => {
          const layerNodes = archData.nodes.filter(n => n.layer === layer.id);
          const visibleNodes = layerNodes.filter(n => state.activeLayers.has(n.layer));
          
          if (visibleNodes.length === 0 && !state.activeLayers.has(layer.id)) return;

          const rowCount = Math.max(1, visibleNodes.length);
          const totalWidth = rowCount * NODE_WIDTH + (rowCount - 1) * NODE_GAP_X;
          if (totalWidth > maxRowWidth) maxRowWidth = totalWidth;

          visibleNodes.forEach((node, idx) => {
            if (!state.nodePositions.has(node.id)) {
              const x = 50 + idx * (NODE_WIDTH + NODE_GAP_X);
              const y = currentY + 35;
              state.nodePositions.set(node.id, { x, y, width: NODE_WIDTH, height: NODE_HEIGHT, layerId: layer.id });
            }
          });

          currentY += NODE_HEIGHT + LAYER_GAP;
        });
      }

      // 5. Render Functions
      function updateTransform() {
        canvas.style.transform = `translate(${state.transform.x}px, ${state.transform.y}px) scale(${state.transform.scale})`;
      }

      function renderSwimlanes() {
        swimlanesLayer.innerHTML = "";
        const sortedLayers = [...archData.layers].sort((a, b) => a.order - b.order);
        let currentY = 20;

        sortedLayers.forEach(layer => {
          if (!state.activeLayers.has(layer.id)) return;
          const layerNodes = archData.nodes.filter(n => n.layer === layer.id);
          
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("class", "swimlane");
          rect.setAttribute("x", "20");
          rect.setAttribute("y", currentY.toString());
          rect.setAttribute("width", "1300");
          rect.setAttribute("height", (NODE_HEIGHT + 50).toString());
          
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("class", "swimlane-label");
          text.setAttribute("x", "35");
          text.setAttribute("y", (currentY + 20).toString());
          text.textContent = layer.name;
          text.setAttribute("fill", layer.color || "#94a3b8");

          g.appendChild(rect);
          g.appendChild(text);
          swimlanesLayer.appendChild(g);

          currentY += NODE_HEIGHT + LAYER_GAP;
        });
      }

      function renderEdges() {
        edgesLayer.innerHTML = "";
        const activeFlow = state.activeFlowId ? archData.flows.find(f => f.id === state.activeFlowId) : null;
        
        // Active Flow Steps mapping
        const activeFlowSteps = activeFlow ? activeFlow.steps : [];
        const activeNodeIds = new Set(activeFlowSteps.map(s => s.nodeId));

        archData.edges.forEach(edge => {
          const srcPos = state.nodePositions.get(edge.source);
          const tgtPos = state.nodePositions.get(edge.target);
          if (!srcPos || !tgtPos) return;

          const srcNode = archData.nodes.find(n => n.id === edge.source);
          const tgtNode = archData.nodes.find(n => n.id === edge.target);
          if (!srcNode || !tgtNode) return;
          if (!state.activeLayers.has(srcNode.layer) || !state.activeLayers.has(tgtNode.layer)) return;

          // Check if this edge is active in current flow
          let isEdgeInActiveFlow = false;
          if (activeFlow) {
            for (let i = 0; i < activeFlowSteps.length - 1; i++) {
              if (activeFlowSteps[i].nodeId === edge.source && activeFlowSteps[i+1].nodeId === edge.target) {
                isEdgeInActiveFlow = true;
                break;
              }
            }
          }

          const isDimmed = activeFlow && !isEdgeInActiveFlow;

          // Calculate connection curve
          const x1 = srcPos.x + srcPos.width / 2;
          const y1 = srcPos.y + (srcPos.y < tgtPos.y ? srcPos.height : 0);
          const x2 = tgtPos.x + tgtPos.width / 2;
          const y2 = tgtPos.y + (srcPos.y < tgtPos.y ? 0 : tgtPos.height);

          const dy = (y2 - y1) * 0.5;
          const pathD = `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`;

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", pathD);
          path.setAttribute("class", `edge-path ${isEdgeInActiveFlow ? 'active' : ''} ${isDimmed ? 'dimmed' : ''}`);
          path.setAttribute("marker-end", isEdgeInActiveFlow ? "url(#arrow-active)" : "url(#arrow)");

          // Edge Label
          if (edge.relation || edge.protocol) {
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;
            const labelText = edge.relation + (edge.protocol ? ` [${edge.protocol}]` : '');

            const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            bg.setAttribute("class", `edge-label-bg ${isDimmed ? 'dimmed' : ''}`);
            bg.setAttribute("x", (midX - (labelText.length * 2.8)).toString());
            bg.setAttribute("y", (midY - 7).toString());
            bg.setAttribute("width", (labelText.length * 5.6).toString());
            bg.setAttribute("height", "14");

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("class", `edge-label-text ${isDimmed ? 'dimmed' : ''}`);
            text.setAttribute("x", midX.toString());
            text.setAttribute("y", midY.toString());
            text.textContent = labelText;

            g.appendChild(bg);
            g.appendChild(text);
          }

          g.appendChild(path);
          edgesLayer.appendChild(g);
        });
      }

      function renderNodes() {
        nodesLayer.innerHTML = "";
        const activeFlow = state.activeFlowId ? archData.flows.find(f => f.id === state.activeFlowId) : null;
        const activeFlowSteps = activeFlow ? activeFlow.steps : [];
        const activeNodeIds = new Set(activeFlowSteps.map(s => s.nodeId));
        const currentStepNodeId = activeFlow && activeFlowSteps[state.activeStepIdx] ? activeFlowSteps[state.activeStepIdx].nodeId : null;

        archData.nodes.forEach(node => {
          if (!state.activeLayers.has(node.layer)) return;
          const pos = state.nodePositions.get(node.id);
          if (!pos) return;

          // Filtering
          const matchesSearch = !state.searchQuery || 
            node.label.toLowerCase().includes(state.searchQuery) ||
            (node.filepath && node.filepath.toLowerCase().includes(state.searchQuery)) ||
            node.type.toLowerCase().includes(state.searchQuery);

          const isDimmed = (activeFlow && !activeNodeIds.has(node.id)) || (!matchesSearch);
          const isActive = activeFlow && activeNodeIds.has(node.id);
          const isCurrentStep = node.id === currentStepNodeId;

          const layerObj = archData.layers.find(l => l.id === node.layer) || { color: "#6366f1", name: node.layer };

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("class", `node-group ${isDimmed ? 'dimmed' : ''} ${isActive ? 'active' : ''} ${isCurrentStep ? 'pulse-step' : ''}`);
          g.setAttribute("transform", `translate(${pos.x}, ${pos.y})`);
          g.setAttribute("data-id", node.id);

          // Card Background
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("class", "node-rect");
          rect.setAttribute("width", pos.width.toString());
          rect.setAttribute("height", pos.height.toString());

          // Layer Pill
          const pill = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          pill.setAttribute("class", "node-layer-pill");
          pill.setAttribute("x", "12");
          pill.setAttribute("y", "12");
          pill.setAttribute("width", "56");
          pill.setAttribute("height", "14");
          pill.setAttribute("fill", layerObj.color || "#6366f1");

          const pillText = document.createElementNS("http://www.w3.org/2000/svg", "text");
          pillText.setAttribute("class", "node-layer-text");
          pillText.setAttribute("x", "40");
          pillText.setAttribute("y", "19");
          pillText.textContent = node.type.split('-')[0].toUpperCase();

          // Title
          const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
          title.setAttribute("class", "node-title");
          title.setAttribute("x", "12");
          title.setAttribute("y", "42");
          title.textContent = node.label.length > 22 ? node.label.slice(0, 20) + "..." : node.label;

          // Subtitle / Tech / Filepath
          const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
          sub.setAttribute("class", "node-subtitle");
          sub.setAttribute("x", "12");
          sub.setAttribute("y", "58");
          const subText = node.tech || node.filepath ? (node.tech || node.filepath.split('/').pop()) : node.type;
          sub.textContent = subText.length > 26 ? subText.slice(0, 24) + ".." : subText;

          g.appendChild(rect);
          g.appendChild(pill);
          g.appendChild(pillText);
          g.appendChild(title);
          g.appendChild(sub);

          // Events: Tooltip and Drag
          g.addEventListener("mouseenter", (e) => showTooltip(e, node, layerObj));
          g.addEventListener("mouseleave", hideTooltip);
          g.addEventListener("mousedown", (e) => startDragNode(e, node));

          nodesLayer.appendChild(g);
        });
      }

      function renderAll() {
        renderSwimlanes();
        renderEdges();
        renderNodes();
      }

      // 6. Tooltip Handler
      function showTooltip(e, node, layer) {
        const inEdges = archData.edges.filter(ed => ed.target === node.id);
        const outEdges = archData.edges.filter(ed => ed.source === node.id);

        tooltip.innerHTML = `
          <h4>
            <span>${node.label}</span>
            <span style="font-size:10px; color:${layer.color || '#fff'}">${layer.name}</span>
          </h4>
          ${node.filepath ? `<div class="tooltip-file">${node.filepath}</div>` : ''}
          <div class="tooltip-desc">${node.description || 'No description provided.'}</div>
          <div class="tooltip-meta">
            <span class="tooltip-tag">Type: ${node.type}</span>
            ${node.tech ? `<span class="tooltip-tag">Tech: ${node.tech}</span>` : ''}
            <span class="tooltip-tag">In: ${inEdges.length}</span>
            <span class="tooltip-tag">Out: ${outEdges.length}</span>
          </div>
        `;
        tooltip.style.display = "block";
        positionTooltip(e);
      }

      function positionTooltip(e) {
        const offset = 15;
        let x = e.clientX + offset;
        let y = e.clientY + offset;
        if (x + 320 > window.innerWidth) x = e.clientX - 330;
        if (y + 180 > window.innerHeight) y = e.clientY - 190;
        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      }

      function hideTooltip() {
        tooltip.style.display = "none";
      }

      // 7. Layer Filter Bar
      function renderLayerFilters() {
        layerFilters.innerHTML = "";
        archData.layers.forEach(layer => {
          const pill = document.createElement("div");
          pill.className = `layer-pill ${state.activeLayers.has(layer.id) ? '' : 'inactive'}`;
          pill.innerHTML = `
            <span class="layer-dot" style="background-color: ${layer.color || '#6366f1'}"></span>
            <span>${layer.name}</span>
          `;
          pill.addEventListener("click", () => {
            if (state.activeLayers.has(layer.id)) {
              if (state.activeLayers.size > 1) state.activeLayers.delete(layer.id);
            } else {
              state.activeLayers.add(layer.id);
            }
            renderLayerFilters();
            renderAll();
          });
          layerFilters.appendChild(pill);
        });
      }

      // 8. Flows Panel Rendering & Navigation
      function renderFlowsList() {
        flowsList.innerHTML = "";
        if (!archData.flows || archData.flows.length === 0) {
          flowsList.innerHTML = `<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:20px;">No execution flows defined.</div>`;
          return;
        }

        archData.flows.forEach(flow => {
          const card = document.createElement("div");
          const isActive = state.activeFlowId === flow.id;
          card.className = `flow-card ${isActive ? 'active' : ''}`;
          
          let stepsHtml = "";
          if (isActive && flow.steps) {
            stepsHtml = `
              <div class="flow-walkthrough">
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;font-weight:600;">Step by Step Path:</div>
                ${flow.steps.map((step, idx) => {
                  const nodeObj = archData.nodes.find(n => n.id === step.nodeId);
                  const isCurrent = idx === state.activeStepIdx;
                  return `
                    <div class="step-item ${isCurrent ? 'current-step' : ''}">
                      <div class="step-num">${step.sequence || idx + 1}</div>
                      <div>
                        <div><strong>${nodeObj ? nodeObj.label : step.nodeId}</strong>: ${step.action}</div>
                        ${step.details ? `<div style="font-size:10px;opacity:0.8;margin-top:2px;">${step.details}</div>` : ''}
                      </div>
                    </div>
                  `;
                }).join("")}
                <div class="flow-controls">
                  <button class="flow-ctrl-btn" id="step-prev">‹ Prev</button>
                  <button class="flow-ctrl-btn" id="step-play">${state.autoPlayTimer ? '❚❚ Pause' : '▶ Play'}</button>
                  <button class="flow-ctrl-btn" id="step-next">Next ›</button>
                </div>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="flow-header">
              <span class="flow-name">${flow.name}</span>
              <span class="flow-steps-count">${flow.steps ? flow.steps.length : 0} steps</span>
            </div>
            <div class="flow-desc">${flow.description}</div>
            ${flow.trigger ? `<div style="font-size:11px;color:var(--accent-amber);margin-bottom:6px;">⚡ ${flow.trigger}</div>` : ''}
            ${stepsHtml}
          `;

          card.addEventListener("click", (e) => {
            if (e.target.closest('.flow-controls')) return;
            if (state.activeFlowId === flow.id) {
              state.activeFlowId = null;
              clearInterval(state.autoPlayTimer);
              state.autoPlayTimer = null;
            } else {
              state.activeFlowId = flow.id;
              state.activeStepIdx = 0;
            }
            renderFlowsList();
            renderAll();
          });

          flowsList.appendChild(card);
        });

        // Bind Flow Walkthrough buttons
        const prevBtn = document.getElementById("step-prev");
        const nextBtn = document.getElementById("step-next");
        const playBtn = document.getElementById("step-play");

        if (prevBtn) {
          prevBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const activeFlow = archData.flows.find(f => f.id === state.activeFlowId);
            if (activeFlow && state.activeStepIdx > 0) {
              state.activeStepIdx--;
              renderFlowsList();
              renderAll();
            }
          });
        }

        if (nextBtn) {
          nextBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const activeFlow = archData.flows.find(f => f.id === state.activeFlowId);
            if (activeFlow && state.activeStepIdx < activeFlow.steps.length - 1) {
              state.activeStepIdx++;
              renderFlowsList();
              renderAll();
            }
          });
        }

        if (playBtn) {
          playBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (state.autoPlayTimer) {
              clearInterval(state.autoPlayTimer);
              state.autoPlayTimer = null;
            } else {
              const activeFlow = archData.flows.find(f => f.id === state.activeFlowId);
              if (!activeFlow) return;
              state.autoPlayTimer = setInterval(() => {
                if (state.activeStepIdx < activeFlow.steps.length - 1) {
                  state.activeStepIdx++;
                } else {
                  state.activeStepIdx = 0;
                }
                renderFlowsList();
                renderAll();
              }, 1600);
            }
            renderFlowsList();
          });
        }
      }

      // 9. Node Dragging
      function startDragNode(e, node) {
        if (e.button !== 0) return;
        e.stopPropagation();
        state.draggedNode = node;
        const pos = state.nodePositions.get(node.id);
        state.dragOffset = {
          x: (e.clientX - state.transform.x) / state.transform.scale - pos.x,
          y: (e.clientY - state.transform.y) / state.transform.scale - pos.y
        };

        const onMouseMove = (ev) => {
          if (!state.draggedNode) return;
          const curPos = state.nodePositions.get(state.draggedNode.id);
          curPos.x = (ev.clientX - state.transform.x) / state.transform.scale - state.dragOffset.x;
          curPos.y = (ev.clientY - state.transform.y) / state.transform.scale - state.dragOffset.y;
          renderEdges();
          renderNodes();
        };

        const onMouseUp = () => {
          state.draggedNode = null;
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseup", onMouseUp);
        };

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
      }

      // 10. Pan and Zoom Handlers
      viewport.addEventListener("mousedown", (e) => {
        if (e.target.closest(".node-group") || e.target.closest(".layer-filter-bar") || e.target.closest(".floating-toolbar")) return;
        state.isPanning = true;
        viewport.classList.add("panning");
        state.panStart = { x: e.clientX - state.transform.x, y: e.clientY - state.transform.y };
      });

      window.addEventListener("mousemove", (e) => {
        if (!state.isPanning) return;
        state.transform.x = e.clientX - state.panStart.x;
        state.transform.y = e.clientY - state.panStart.y;
        updateTransform();
      });

      window.addEventListener("mouseup", () => {
        state.isPanning = false;
        viewport.classList.remove("panning");
      });

      viewport.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomFactor = 1.1;
        const oldScale = state.transform.scale;
        const newScale = e.deltaY < 0 ? oldScale * zoomFactor : oldScale / zoomFactor;
        const boundedScale = Math.min(Math.max(0.3, newScale), 3);

        const mouseX = e.clientX - state.transform.x;
        const mouseY = e.clientY - state.transform.y;

        state.transform.x -= (mouseX / oldScale) * (boundedScale - oldScale);
        state.transform.y -= (mouseY / oldScale) * (boundedScale - oldScale);
        state.transform.scale = boundedScale;

        updateTransform();
      }, { passive: false });

      // Toolbar Controls
      document.getElementById("tool-zoom-in").addEventListener("click", () => {
        state.transform.scale = Math.min(3, state.transform.scale * 1.2);
        updateTransform();
      });
      document.getElementById("tool-zoom-out").addEventListener("click", () => {
        state.transform.scale = Math.max(0.3, state.transform.scale / 1.2);
        updateTransform();
      });
      document.getElementById("tool-fit").addEventListener("click", () => {
        state.transform = { x: 50, y: 50, scale: 0.85 };
        updateTransform();
      });
      document.getElementById("btn-reset-view").addEventListener("click", () => {
        state.transform = { x: 80, y: 80, scale: 0.95 };
        state.activeFlowId = null;
        state.searchQuery = "";
        searchInput.value = "";
        state.nodePositions.clear();
        calculateLayout();
        updateTransform();
        renderFlowsList();
        renderAll();
      });

      // Search Handler
      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value.toLowerCase().trim();
        renderNodes();
        renderEdges();
      });

      // Sidebar Toggle
      document.getElementById("btn-toggle-flows").addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
      });

      // JSON Modal Handlers
      const jsonModal = document.getElementById("json-modal");
      const jsonContent = document.getElementById("json-content");
      document.getElementById("btn-view-json").addEventListener("click", () => {
        jsonContent.textContent = JSON.stringify(archData, null, 2);
        jsonModal.classList.add("open");
      });
      document.getElementById("modal-close").addEventListener("click", () => {
        jsonModal.classList.remove("open");
      });

      // Initialization
      calculateLayout();
      updateTransform();
      renderLayerFilters();
      renderFlowsList();
      renderAll();
    })();
  </script>
</body>
</html>
